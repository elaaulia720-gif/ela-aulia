<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>03 - Navbar - Sesudah</title>

    <style>
        
        nav {
            background-color: #222;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .logo {
            color: white;
            font-size: 24px;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
        }

        nav ul li a:hover {
            color: #00bfff;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#" class="logo">MyWebsite</a>

        <ul>
            <li><a href="#">Beranda</a></li>
            <li><a href="#">Layanan</a></li>
            <li><a href="#">Tentang</a></li>
            <li><a href="#">Kontak</a></li>
        </ul>
    </nav>

</body>
</html>
