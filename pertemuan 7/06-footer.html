<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>06 - Footer - Sesudah</title>

    <style>
        /* 1. Mengatur tampilan footer */
        footer {
            background-color: #222;
            color: white;
            padding: 50px;
        }

        /* 2. Membuat 4 kolom menggunakan CSS Grid */
        .footer-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        /* 3. Mengatur daftar dan link */
        .footer-col ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-col ul li {
            margin-bottom: 10px;
        }

        .footer-col a {
            color: #ccc;
            text-decoration: none;
        }

        .footer-col a:hover {
            color: white;
        }

        /* 4. Memberi jarak pada judul */
        .footer-col h3 {
            margin-bottom: 20px;
        }

        /* Mengatur paragraf */
        .footer-col p {
            color: #ccc;
            line-height: 1.6;
        }

        /* 5. Bagian copyright */
        .footer-bottom {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #555;
            text-align: center;
            color: #ccc;
        }
    </style>

</head>

<body>

    <footer>

     <!-- 
    INSTRUKSI PENGERJAAN:
    1. Beri background gelap pada <footer>, warna teks putih/terang, dan padding yang cukup luas (misal padding: 50px).
    2. Jadikan class ".footer-container" sebagai CSS Grid dengan "grid-template-columns: repeat(4, 1fr)" agar membentuk 4 kolom sejajar, beri gap antar kolom.
    3. Hilangkan bullet pada <ul>, ubah warna link <a> agar kontras (misal abu-abu terang), dan hilangkan garis bawah.
    4. Tambahkan jarak (margin) pada tiap <h3>.
    5. Bagian hak cipta (copyright) diatur di bawah dengan teks ditengah (text-align: center) dan garis atas (border-top).
    -->
        <div class="footer-container">

            <div class="footer-col">
                <h3>Tentang Kami</h3>
                <p>
                    Kami adalah perusahaan yang menyediakan layanan digital terbaik untuk Anda.
                </p>
            </div>

            <div class="footer-col">
                <h3>Tautan Cepat</h3>
                <ul>
                    <li><a href="#">Beranda</a></li>
                    <li><a href="#">Tentang</a></li>
                    <li><a href="#">Layanan</a></li>
                </ul>
            </div>

            <div class="footer-col">
                <h3>Bantuan</h3>
                <ul>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Cara Pesan</a></li>
                    <li><a href="#">Pengembalian</a></li>
                </ul>
            </div>

            <div class="footer-col">
                <h3>Sosial Media</h3>
                <ul>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Twitter</a></li>
                </ul>
            </div>

        </div>

        <div class="footer-bottom">
            <p>&copy; 2023 Hak Cipta Dilindungi.</p>
        </div>

    </footer>

</body>
</html>
