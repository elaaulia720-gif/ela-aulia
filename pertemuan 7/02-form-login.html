<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>02 - Form Login - Sesudah</title>

    <style>
        
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 300px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: blue;
            outline: none;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Masuk ke Akun</h2>

        <form>
            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Masukkan email"
            >

            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Masukkan password"
            >

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
