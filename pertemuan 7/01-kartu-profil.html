<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>01 - Kartu Profil - Sesudah</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
        }
        .profile-card {
            width: 300px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .profile-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .profile-card h2 {
            margin-bottom: 8px;
        }
        .profile-card p {
            margin-bottom: 20px;
            color: #666;
        }
        .profile-card a {
            display: inline-block;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
        }
        .profile-card a:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <img src="https://ui-avatars.com/api/?name=Ela+Aulia&s=150" alt="Foto Ela">

        <h2>Ela Aulia</h2>

        <p>Web Developer</p>

        <a href="#">Hubungi Saya</a>
    </div>

</body>
</html>
